# Server
server.port=8082
server.servlet.context-path=/api

# Database (MySQL) — dedicated schema for job board
spring.datasource.url=jdbc:mysql://localhost:3306/trustedwork_jobboard_db?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Must match user-service signing secret so tokens issued there validate here
jwt.secret=PiCloudSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256Bits!!

# Upstream user-service (REST only; user ids validated via /users/me + role checks)
user.service.base-url=http://localhost:8081/api

# Demo dataset (jobs, applications, freelancer profiles, fraud flags). Runs only when job_offers is empty.
# Set jobboard.demo-data.enabled=false in production. Align user ids with your user-service (CLIENT / FREELANCER).
jobboard.demo-data.enabled=true
jobboard.demo-data.client-user-id=2
jobboard.demo-data.freelancer-user-ids=3,4

# Platform heuristics (until dedicated analytics service)
jobboard.platform.mock-average-budget=2000
jobboard.opportunity.apply-link-base=http://localhost:4200/app/opportunities/freelance-jobs
jobboard.agent.interval-ms=3600000

# Mail (JavaMailSender — opportunity agent)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Async pool
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=8

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.tn.esprit.smartjobboard=INFO
logging.level.org.springframework.security=INFO

