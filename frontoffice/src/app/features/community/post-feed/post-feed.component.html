<div class="cm-page cm-feed-page">
  <app-community-page-header
    eyebrow="Feed"
    title="Your feed"
    subtitle="Filter by community, open posts, or browse a community to see Learning courses (modules &amp; PDF lessons).">
    <ng-container cmActions>
      <button type="button" class="cm-btn cm-btn--secondary" (click)="goCreateCommunity()">
        <i class="fas fa-users" aria-hidden="true"></i>
        New community
      </button>
      <button type="button" class="cm-btn cm-btn--primary" (click)="goCreatePost()">
        <i class="fas fa-pen" aria-hidden="true"></i>
        New post
      </button>
    </ng-container>
  </app-community-page-header>

  <div class="cm-feed-layout">
    <aside class="cm-feed-sidebar cm-aside-stack">
      <section class="cm-panel">
        <div class="cm-panel__head">
          <h2 class="cm-panel__title">Shortcuts</h2>
        </div>
        <div class="cm-panel__body">
          <div class="cm-btn-group" style="flex-direction: column; align-items: stretch">
            <button type="button" class="cm-btn cm-btn--secondary" (click)="goCreateCommunity()">
              <i class="fas fa-plus" aria-hidden="true"></i>
              Create community
            </button>
            <button type="button" class="cm-btn cm-btn--ghost" (click)="goCreatePost()">
              <i class="fas fa-file-circle-plus" aria-hidden="true"></i>
              Create post
            </button>
          </div>
        </div>
      </section>

      <section class="cm-panel">
        <div class="cm-panel__head">
          <h2 class="cm-panel__title">Communities</h2>
        </div>
        <div class="cm-panel__body">
          <div *ngIf="communities.length === 0" class="cm-muted">No communities loaded yet.</div>
          <div class="cm-feed-nav" *ngIf="communities.length > 0">
            <button
              type="button"
              class="cm-feed-nav__btn"
              [class.cm-feed-nav__btn--active]="activeCommunityId == null"
              (click)="onSelectCommunity(null)">
              All communities
            </button>
            <button
              *ngFor="let community of communities"
              type="button"
              class="cm-feed-nav__btn"
              [class.cm-feed-nav__btn--active]="activeCommunityId === community.id"
              (click)="onSelectCommunity(community.id)">
              {{ community.name }}
            </button>
          </div>
        </div>
      </section>

      <section class="cm-panel">
        <div class="cm-panel__head">
          <h2 class="cm-panel__title">My posts</h2>
        </div>
        <div class="cm-panel__body">
          <ng-container *ngIf="myPosts$ | async as myPosts">
            <p *ngIf="myPosts.length === 0" class="cm-muted">You have not created a post yet.</p>
            <div class="cm-feed-nav" *ngIf="myPosts.length > 0">
              <a
                *ngFor="let post of myPosts"
                class="cm-feed-nav__link"
                [routerLink]="['posts', post.id]"
                [relativeTo]="shell">
                <span class="cm-feed-nav__link-title">{{ post.title }}</span>
                <i class="fas fa-arrow-right" aria-hidden="true"></i>
              </a>
            </div>
          </ng-container>
        </div>
      </section>
    </aside>

    <div class="cm-feed-main">
      <div class="cm-toolbar">
        <div class="cm-toolbar__left">
          <h2 class="cm-feed-main__heading">{{ getCommunityName() }}</h2>
        </div>
        <div class="cm-toolbar__right cm-muted">{{ posts.length }} posts</div>
      </div>

      <app-community-filter
        class="cm-feed-filter"
        [communities]="communities"
        [activeCommunityId]="activeCommunityId"
        (selectCommunity)="onSelectCommunity($event)">
      </app-community-filter>

      <div *ngIf="loading" class="cm-state">Loading posts…</div>
      <div *ngIf="!loading && error" class="cm-state cm-state--error">{{ error }}</div>

      <app-empty-state
        *ngIf="!loading && !error && posts.length === 0"
        icon="fa-note-sticky"
        title="No posts in this view"
        description="Pick another community or add the first post.">
      </app-empty-state>

      <div class="cm-feed-cards" *ngIf="!loading && !error && posts.length > 0">
        <app-post-card
          *ngFor="let post of posts; trackBy: trackByPostId"
          [post]="post"
          [shell]="shell"
          [communityName]="communityNameById(post.communityId)"
          [commentCount]="commentCountByPost[post.id] || 0"
          (vote)="onVote($event)">
        </app-post-card>
      </div>
    </div>
  </div>
</div>
