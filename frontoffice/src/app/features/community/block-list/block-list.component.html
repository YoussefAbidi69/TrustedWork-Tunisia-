<div class="community-page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Blocks</h1>
      <p class="page-subtitle">{{ filteredItems.length }} blocks found</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-ghost btn-sm" (click)="loadData()">
        <i class="fas fa-rotate-right"></i> Refresh
      </button>
    </div>
  </div>

  <div class="filters-bar" style="margin-bottom: 20px; display: flex; gap: 10px;">
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" class="form-control" placeholder="Search by User ID..." [(ngModel)]="searchQuery" (input)="onSearch()">
    </div>
  </div>

  <div class="empty-state" *ngIf="loading">
    <i class="fas fa-spinner fa-spin"></i>
    <p>Loading...</p>
  </div>

  <div class="card" *ngIf="!loading">
    <div class="table-wrap">
      <table class="tw-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Type</th>
            <th>Section ID</th>
            <th>Preview</th>
            <th>Order</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of filteredItems">
            <td>{{ item.id }}</td>
            <td><strong>{{ item.title }}</strong></td>
            <td><span class="badge badge-info">{{ item.type }}</span></td>
            <td>#{{ item.sectionId }}</td>
            <td>
              <div style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.8rem; color: var(--color-text-muted);">
                {{ item.content || item.fileUrl }}
              </div>
            </td>
            <td>{{ item.orderIndex }}</td>
            <td>
              <div class="action-btns">
                <a class="btn btn-sm btn-ghost" [routerLink]="['/admin/community/blocks', item.id, 'detail']">
                  <i class="fas fa-eye"></i> Details
                </a>
                <button class="btn btn-sm btn-danger" (click)="deleteItem(item)" [disabled]="actionLoading === item.id">
                  <i class="fas fa-trash"></i> Delete
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="empty-state" *ngIf="filteredItems.length === 0">
        <i class="fas fa-folder-open"></i>
        <p>No items found</p>
      </div>
    </div>
  </div>
</div>
