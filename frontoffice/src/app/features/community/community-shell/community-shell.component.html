<div class="cm-shell">
  <header class="cm-shell__bar" aria-label="Community navigation">
    <div class="cm-shell__brand">
      <span class="cm-shell__title">Community</span>
    </div>

    <nav class="cm-shell__nav">
      <div class="cm-shell__dropdown" [class.cm-shell__dropdown--open]="communityMenuOpen">
        <button
          type="button"
          class="cm-shell__nav-trigger"
          (click)="toggleCommunityMenu($event)"
          [attr.aria-expanded]="communityMenuOpen">
          Community
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <div class="cm-shell__dropdown-panel" role="menu">
         <a
          [routerLink]="['/community']"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="cm-shell__dropdown-item"
          (click)="closeMenus()">
          <i class="fas fa-house" aria-hidden="true"></i>
          Feed
        </a>
          <a
            [routerLink]="['browse']"
            [relativeTo]="route"
            routerLinkActive="active"
            class="cm-shell__dropdown-item"
            (click)="closeMenus()">
            <i class="fas fa-compass" aria-hidden="true"></i>
            Browse communities
          </a>
          <a
            *ngIf="parentCommunityId && authService.isLoggedIn()"
            [routerLink]="['courses', 'new']"
            [queryParams]="{ communityId: parentCommunityId }"
            [relativeTo]="route"
            class="cm-shell__dropdown-item"
            (click)="closeMenus()">
            <i class="fas fa-graduation-cap" aria-hidden="true"></i>
            New learning course
          </a>
          <a
            [routerLink]="['create']"
            [relativeTo]="route"
            routerLinkActive="active"
            class="cm-shell__dropdown-item"
            (click)="closeMenus()">
            <i class="fas fa-plus-circle" aria-hidden="true"></i>
            New community
          </a>
          
        </div>
      </div>

      <a
        [routerLink]="['browse']"
        [relativeTo]="route"
        routerLinkActive="active"
        class="cm-shell__link"
        title="Pick a community, then open Learning courses in the sidebar"
        (click)="closeMenus()">
        <i class="fas fa-graduation-cap" aria-hidden="true"></i>
        Learning
      </a>

      <a
        *ngIf="authService.isLoggedIn()"
        [routerLink]="['contributions']"
        [relativeTo]="route"
        routerLinkActive="active"
        class="cm-shell__link"
        (click)="closeMenus()">
        <i class="fas fa-hand-holding-heart" aria-hidden="true"></i>
        Contributions
      </a>
    </nav>
  </header>

  <div class="cm-shell__outlet">
    <router-outlet></router-outlet>
  </div>
</div>
