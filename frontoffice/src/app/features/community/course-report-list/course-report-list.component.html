<div class="community-page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Course Reports</h1>
      <p class="page-subtitle">{{ filteredItems.length }} reports found</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-ghost btn-sm" (click)="loadData()">
        <i class="fas fa-rotate-right"></i> Refresh
      </button>
    </div>
  </div>

  <div class="filters-bar" style="margin-bottom: 20px; display: flex; gap: 10px;">
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" class="form-control" placeholder="Search by reason..." [(ngModel)]="searchQuery" (input)="onSearch()">
    </div>
  </div>

  <div class="empty-state" *ngIf="loading">
    <i class="fas fa-spinner fa-spin"></i>
    <p>Loading...</p>
  </div>

  <div class="card" *ngIf="!loading">
    <div class="table-wrap">
      <table class="tw-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Reporter</th>
            <th>Course ID</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Created At</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of filteredItems">
            <td>{{ item.id }}</td>
            <td><strong>#{{ item.reporterId }}</strong></td>
            <td><strong>#{{ item.courseId }}</strong></td>
            <td>{{ item.reason }}</td>
            <td>
              <span class="badge" [ngClass]="item.status === 'OPEN' ? 'badge-warning' : (item.status === 'RESOLVED' ? 'badge-success' : 'badge-danger')">
                {{ item.status }}
              </span>
            </td>
            <td>{{ item.createdAt | date:'MMM d, yyyy' }}</td>
            <td>
              <div class="action-btns" *ngIf="item.status === 'OPEN'">
                <button class="btn btn-sm btn-success" (click)="resolveItem(item, 'RESOLVED')" [disabled]="actionLoading === item.id">
                  <i class="fas fa-check"></i> Resolve
                </button>
                <button class="btn btn-sm btn-warning" (click)="resolveItem(item, 'REJECTED')" [disabled]="actionLoading === item.id">
                  <i class="fas fa-xmark"></i> Reject
                </button>
              </div>
              <div class="action-btns" *ngIf="item.status !== 'OPEN'">
                <button class="btn btn-sm btn-danger" (click)="deleteItem(item)" [disabled]="actionLoading === item.id">
                  <i class="fas fa-trash"></i> Delete
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="empty-state" *ngIf="filteredItems.length === 0">
        <i class="fas fa-folder-open"></i>
        <p>No items found</p>
      </div>
    </div>
  </div>
</div>
