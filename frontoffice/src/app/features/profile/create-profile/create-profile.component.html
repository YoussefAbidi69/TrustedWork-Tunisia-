<div class="create-container">

  <div class="create-card">

    <div class="create-header">
      <h1>Créez votre profil freelancer</h1>
      <p>Ces informations seront visibles sur votre profil public TrustedWork.</p>
    </div>

    <div class="error-banner" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="form-body">

      <div class="form-group">
        <label>Titre professionnel *</label>
        <input
          type="text"
          [(ngModel)]="profile.headline"
          placeholder="Ex: Développeur Spring Boot & Angular — Tunis"
          class="form-control"
        />
        <small>Ce titre apparaît en premier sur votre profil public.</small>
      </div>

      <div class="form-group">
        <label>Bio</label>
        <textarea
          [(ngModel)]="profile.bio"
          placeholder="Décrivez votre expertise, vos spécialités et ce qui vous différencie..."
          class="form-control"
          rows="4"
        ></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Taux horaire (TND)</label>
          <input
            type="number"
            [(ngModel)]="profile.hourlyRate"
            placeholder="Ex: 35"
            min="1"
            class="form-control"
          />
        </div>
        <div class="form-group">
          <label>Gouvernorat</label>
          <select [(ngModel)]="profile.region" class="form-control">
            <option value="">-- Sélectionner --</option>
            <option *ngFor="let r of regions" [value]="r">{{ r }}</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Disponibilité</label>
          <select [(ngModel)]="profile.availabilityStatus" class="form-control">
            <option value="AVAILABLE">Disponible</option>
            <option value="BUSY">Occupé</option>
            <option value="ON_VACATION">En vacances</option>
          </select>
        </div>
        <div class="form-group">
          <label>Type de projets</label>
          <select [(ngModel)]="profile.projectType" class="form-control">
            <option value="BOTH">Court et long terme</option>
            <option value="SHORT_TERM">Court terme</option>
            <option value="LONG_TERM">Long terme</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Visibilité du profil</label>
        <select [(ngModel)]="profile.visibility" class="form-control">
          <option value="PUBLIC">Public — visible par tous</option>
          <option value="CONNECTIONS_ONLY">Connexions uniquement</option>
          <option value="PRIVATE">Privé</option>
        </select>
      </div>

    </div>

    <div class="create-footer">
      <button
        class="btn-primary"
        (click)="onSubmit()"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Création en cours...' : 'Créer mon profil' }}
      </button>
    </div>

  </div>

</div>
