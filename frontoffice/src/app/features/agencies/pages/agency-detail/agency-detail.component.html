<div class="agency-detail-container" *ngIf="!loading && agency">
  
  <header class="agency-header">
    <div class="header-main">
      <div class="agency-visual">
        <div class="visual-box" [style.background-image]="agency.logoUrl ? 'url(' + agency.logoUrl + ')' : ''">
          <i *ngIf="!agency.logoUrl" class="fas fa-building"></i>
        </div>
      </div>
      <div class="header-info">
        <div class="title-row">
          <h1>{{ agency.name }}</h1>
          <span class="badge badge--{{ agency.tier.toLowerCase() }}">{{ agency.tier }}</span>
        </div>
        <p class="agency-location">
          <i class="fas fa-location-dot"></i> {{ agency.city }}, {{ agency.country }}
        </p>
      </div>
    </div>
    
    <div class="header-actions">
      <button class="btn btn--outline btn--sm" routerLink="/app/agencies">
        <i class="fas fa-arrow-left"></i> Retour
      </button>
      <a [routerLink]="['edit']" class="btn btn--primary btn--sm">
        <i class="fas fa-edit"></i> Modifier
      </a>
    </div>
  </header>

  <nav class="agency-tabs">
    <button 
      *ngFor="let tab of tabs" 
      class="tab-link" 
      [class.active]="activeTab === tab.id"
      (click)="setActiveTab(tab.id)">
      <i class="fas" [ngClass]="tab.icon"></i>
      {{ tab.label }}
    </button>
  </nav>

  <section class="tab-content">
    <!-- Vue d'ensemble -->
    <div *ngIf="activeTab === 'overview'" class="overview-grid">
      <div class="info-card">
        <h3>À propos</h3>
        <p>{{ agency.description || 'Acune description fournie.' }}</p>
        <hr>
        <div class="info-meta">
          <div class="meta-row">
            <strong>Créé le :</strong>
            <span>{{ agency.createdAt | date:'longDate' }}</span>
          </div>
          <div class="meta-row">
            <strong>Statut :</strong>
            <span [class.text-success]="agency.active" [class.text-danger]="!agency.active">
              {{ agency.active ? 'Actif' : 'Inactif' }}
            </span>
          </div>
        </div>
      </div>
      
      <div class="stats-mini">
        <app-stat-card title="Membres" value="--" icon="fa-users" color="azure"></app-stat-card>
        <app-stat-card title="Projets" value="--" icon="fa-diagram-project" color="terracotta"></app-stat-card>
      </div>
    </div>

    <!-- Sub-components based on activeTab -->
    <app-agency-members *ngIf="activeTab === 'members'" [agencyId]="agency.id"></app-agency-members>
    <app-team-projects *ngIf="activeTab === 'projects'" [agencyId]="agency.id"></app-team-projects>
    <app-task-kanban *ngIf="activeTab === 'kanban'" [agencyId]="agency.id"></app-task-kanban>
    <app-agency-invitations *ngIf="activeTab === 'invitations'" [agencyId]="agency.id"></app-agency-invitations>
    <app-performance-dashboard *ngIf="activeTab === 'analytics'" [agencyId]="agency.id"></app-performance-dashboard>
    <app-collaboration-logs *ngIf="activeTab === 'logs'" [agencyId]="agency.id"></app-collaboration-logs>
  </section>

</div>

<div *ngIf="loading" class="loading-full">
  <app-loading-spinner></app-loading-spinner>
</div>
