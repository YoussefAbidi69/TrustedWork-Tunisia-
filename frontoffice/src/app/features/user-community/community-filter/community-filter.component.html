<section class="cm-panel cm-filter">
  <div class="cm-panel__head">
    <h2 class="cm-panel__title">Filter feed</h2>
  </div>
  <div class="cm-panel__body">
    <div class="cm-filter__list">
      <button
        type="button"
        class="cm-filter__btn"
        [class.cm-filter__btn--active]="activeCommunityId == null"
        (click)="selectAll()">
        <i class="fas fa-layer-group" aria-hidden="true"></i>
        All communities
      </button>
      <button
        *ngFor="let community of communities"
        type="button"
        class="cm-filter__btn"
        [class.cm-filter__btn--active]="activeCommunityId === community.id"
        (click)="selectOne(community.id)">
        <i class="fas fa-circle" aria-hidden="true"></i>
        {{ community.name }}
      </button>
    </div>
  </div>
</section>
