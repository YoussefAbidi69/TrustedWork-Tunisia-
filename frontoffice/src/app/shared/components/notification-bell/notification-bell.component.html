<div class="notif-wrapper">

  <!-- Bouton cloche -->
  <button
    type="button"
    class="notification-bell"
    title="Notifications"
    (click)="togglePanel($event)">
    <i class="fas fa-bell"></i>
    <span *ngIf="count > 0" class="notification-bell__count">{{ displayCount }}</span>
    <span *ngIf="hasPulse && count > 0" class="notification-bell__pulse"></span>
  </button>

  <!-- Panneau dropdown -->
  <div class="notif-panel" *ngIf="isOpen" (click)="$event.stopPropagation()">

    <div class="notif-panel__header">
      <strong>Notifications</strong>
      <span class="notif-panel__badge" *ngIf="messages.length > 0">
        {{ messages.length }}
      </span>
    </div>

    <!-- Liste scrollable -->
    <div class="notif-panel__list" *ngIf="messages.length > 0">
      <div
        class="notif-item"
        *ngFor="let msg of messages"
        (click)="onNotifClick(msg)">

        <div class="notif-item__icon" [style.color]="getIconColor(msg.type)">
          <i [class]="getIcon(msg.type)"></i>
        </div>

        <div class="notif-item__body">
          <p class="notif-item__message">{{ msg.message }}</p>
          <span class="notif-item__time">
            {{ formatDate(msg.createdAt) }}
          </span>
        </div>

        <i class="fas fa-chevron-right notif-item__arrow"></i>
      </div>
    </div>

    <!-- État vide (WS) -->
    <div class="notif-panel__empty" *ngIf="messages.length === 0 && projectNotifications.length === 0">
      <i class="fas fa-bell-slash"></i>
      <p>Aucune notification</p>
    </div>

    <!-- ── Section notifications projet ── -->
    <ng-container *ngIf="projectNotifications.length > 0">
      <div class="notif-section-label">
        <i class="fas fa-diagram-project"></i>
        Projets
        <span class="notif-section-count" *ngIf="projectUnreadCount > 0">{{ projectUnreadCount }}</span>
      </div>

      <div class="notif-panel__list">
        <div
          class="notif-item"
          [class.notif-item--unread]="!notif.read"
          *ngFor="let notif of projectNotifications"
          (click)="onProjectNotifClick(notif)">

          <div class="notif-item__icon" [style.color]="getProjectIconColor(notif.type)">
            <i [class]="getProjectIcon(notif.type)"></i>
          </div>

          <div class="notif-item__body">
            <p class="notif-item__message">{{ notif.message }}</p>
            <span class="notif-item__time">
              <i class="fas fa-folder-open" style="font-size:10px; opacity:.6"></i>
              {{ notif.title }} · {{ formatDate(notif.createdAt) }}
            </span>
          </div>

          <i class="fas fa-chevron-right notif-item__arrow"></i>
        </div>
      </div>
    </ng-container>

  </div>
</div>
