<aside class="dashboard-sidebar" [class.collapsed]="collapsed">
  <a routerLink="/app/dashboard" class="sb-brand">
    <div class="sb-logo">TW</div>
    <div class="sb-brand-text" *ngIf="!collapsed">
      <strong>TrustedWork</strong>
      <small>Tunisia</small>
    </div>
  </a>
  <div class="sb-profile">
    <div class="profile-avatar">{{ authService.getUserInitials() }}</div>
    <div class="profile-meta" *ngIf="!collapsed">
      <strong>{{ currentUser?.email }}</strong>
      <span class="trust-badge">Trust {{ trustLevel }}/5</span>
    </div>
  </div>
  <button type="button" class="sb-collapse-btn" (click)="onToggleCollapse()">
    <i class="fas" [ngClass]="collapsed ? 'fa-angles-right' : 'fa-angles-left'"></i>
  </button>
  <nav class="sidebar-nav">
    <a [routerLink]="dashboardLink.route" routerLinkActive="active" class="sidebar-link">
      <i class="fas" [ngClass]="dashboardLink.icon"></i>
      <span *ngIf="!collapsed">{{ dashboardLink.label }}</span>
    </a>
    <div class="nav-group" *ngFor="let group of navGroups">
      <button type="button" class="sidebar-link sidebar-group-btn" [class.group-open]="group.expanded" (click)="toggleGroup(group)" [title]="collapsed ? group.label : ''">
        <i class="fas" [ngClass]="group.icon"></i>
        <span *ngIf="!collapsed">{{ group.label }}</span>
        <i class="fas fa-chevron-down chevron" *ngIf="!collapsed" [class.rotated]="group.expanded"></i>
      </button>
      <div class="group-children" [class.open]="group.expanded && !collapsed">
        <ng-container *ngFor="let child of group.children">
          <a [routerLink]="child.route" routerLinkActive="active-child" class="sidebar-child-link">
            <i class="fas" [ngClass]="child.icon"></i>
            <span>{{ child.label }}</span>
          </a>
        </ng-container>
      </div>
    </div>
    <hr class="sidebar-divider" />
    <div class="sidebar-section-label" *ngIf="!collapsed">Bientot disponible</div>
    <div *ngFor="let item of comingSoonItems" class="sidebar-link sidebar-link--disabled" [title]="collapsed ? item.label : ''">
      <i class="fas" [ngClass]="item.icon"></i>
      <span *ngIf="!collapsed">{{ item.label }}</span>
      <small class="coming-soon-badge" *ngIf="!collapsed">Soon</small>
    </div>
  </nav>
  <div class="sidebar-footer">
    <button type="button" class="sidebar-link sidebar-link--logout" (click)="onLogout()">
      <i class="fas fa-right-from-bracket"></i>
      <span *ngIf="!collapsed">Deconnexion</span>
    </button>
  </div>
</aside>
