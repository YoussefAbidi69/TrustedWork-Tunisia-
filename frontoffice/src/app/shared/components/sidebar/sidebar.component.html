<aside class="dashboard-sidebar" [class.collapsed]="collapsed">

  <a routerLink="/app/dashboard" class="sb-brand">
    <div class="sb-logo">TW</div>
    <div class="sb-brand-text" *ngIf="!collapsed">
      <strong>TrustedWork</strong>
      <small>Tunisia</small>
    </div>
  </a>

  <div class="sb-profile">
    <div class="profile-avatar">
      {{ authService.getUserInitials() }}
    </div>
    <div class="profile-meta" *ngIf="!collapsed">
      <strong>{{ currentUser?.email }}</strong>
      <span>Session active</span>
    </div>
  </div>

  <!-- Trust Level — valeur réelle chargée depuis le backend -->
  <div class="sidebar-trust">
    <div class="sidebar-trust__head">
      <span *ngIf="!collapsed">Trust Level</span>
      <strong>{{ trustLevel }}/5</strong>
    </div>
  </div>

  <button type="button" class="sb-collapse-btn" (click)="onToggleCollapse()">
    <i class="fas" [ngClass]="collapsed ? 'fa-angles-right' : 'fa-angles-left'"></i>
  </button>

  <nav class="sidebar-nav">

    <div class="sidebar-section-label" *ngIf="!collapsed">Mon espace</div>

    <a
      *ngFor="let item of activeItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="sidebar-link">
      <div class="sidebar-link__icon"><i class="fas" [ngClass]="item.icon"></i></div>
      <span *ngIf="!collapsed" class="sidebar-link__label">{{ item.label }}</span>
      <span *ngIf="!collapsed && item.badge" class="sidebar-link__badge">{{ item.badge }}</span>
    </a>

    <hr />

    <!-- Modules Agences -->
    <div class="sidebar-accordion" [class.sidebar-accordion--collapsed]="collapsed">
      <div class="sidebar-link accordion-header" (click)="agencyExpanded = !agencyExpanded" [class.active]="agencyItems.length > 0">
        <div class="sidebar-link__icon"><i class="fas fa-building"></i></div>
        <span *ngIf="!collapsed" class="sidebar-link__label">Agences</span>
        <i class="fas fa-chevron-down accordion-caret" *ngIf="!collapsed" [class.rotated]="!agencyExpanded"></i>
      </div>
      <div class="accordion-body" *ngIf="agencyExpanded || collapsed">
        <a
          *ngFor="let item of agencyItems"
          [routerLink]="item.route"
          [queryParams]="item.queryParams"
          routerLinkActive="active"
          class="sidebar-link submenu-link">
          <div class="sidebar-link__icon"><i class="fas" [ngClass]="item.icon"></i></div>
          <span *ngIf="!collapsed" class="sidebar-link__label">{{ item.label }}</span>
          <span *ngIf="!collapsed && item.badge" class="sidebar-link__badge">{{ item.badge }}</span>
        </a>
      </div>
    </div>

    <hr />

    <div class="sidebar-section-label" *ngIf="!collapsed">Autres modules</div>

    <div
      *ngFor="let item of comingSoonItems"
      class="sidebar-link sidebar-link--disabled">
      <div class="sidebar-link__icon"><i class="fas" [ngClass]="item.icon"></i></div>
      <span *ngIf="!collapsed" class="sidebar-link__label">{{ item.label }}</span>
      <small *ngIf="!collapsed">Bientôt</small>
    </div>

  </nav>

  <div class="sidebar-footer">
    <button
      type="button"
      class="sidebar-link sidebar-link--logout"
      (click)="onLogout()">
      <i class="fas fa-right-from-bracket"></i>
      <span *ngIf="!collapsed">Déconnexion</span>
    </button>
  </div>

</aside>
