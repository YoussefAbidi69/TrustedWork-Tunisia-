spring.application.name=ms-contract-servicee
server.port=${SERVER_PORT:8085}

# Service discovery (Eureka)
# The Eureka client is on the classpath; if you are not running a Eureka server locally,
# keep it disabled to avoid "was unable to send heartbeat" noise.
# Enable with: EUREKA_ENABLED=true (and optionally override EUREKA_DEFAULT_ZONE).
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_ENABLED:false}
eureka.client.fetch-registry=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
# User Service Configuration
user.service.url=http://localhost:8081/api
# Optional internal key for service-to-service calls. Leave empty unless ms-user explicitly enforces it.
internal.api.key=${INTERNAL_API_KEY:}

# JWT (must match ms-user-service)
jwt.secret=${JWT_SECRET:PiCloudSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256Bits!!}
# Database
spring.datasource.url=jdbc:mysql://localhost:3306/trustedwork_contract_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA / HIBERNATE
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
# Avoid MySQL native ENUM columns for @Enumerated fields (use VARCHAR instead).
spring.jpa.properties.hibernate.type.prefer_native_enum_types=false

# Jackson (helpful for Angular forms sending empty strings)
spring.jackson.deserialization.accept-empty-string-as-null-object=true
spring.jackson.deserialization.fail-on-unknown-properties=false

payment.simulation.enabled=true

# Commission: wallet de la plateforme (reçoit le montant de commission lors des releases)
# Attention: c'est un wallet DB (auto-increment). Par défaut on met 1, mais c'est configurable.
platform.wallet.id=1

# Contract creation rules
# Set to false in dev if you want to allow creating contracts with freelancers whose KYC is still PENDING.
contract.creation.requireFreelancerKycApproved=false

# Delivery proof (POD) rules
# When true, submitting a milestone requires including a DeliveryProof payload in POST /api/v1/milestones/{id}/submit
milestone.submission.requireDeliveryProof=false
# When true, approving a milestone requires a DeliveryProof to exist for that milestone
milestone.approval.requireDeliveryProof=false

# In-app signature flow
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}
app.signature.token-ttl-minutes=${SIGN_TOKEN_TTL_MINUTES:2880}
# When true, payment endpoints require the contract to be signed first (PENDING_PAYMENT)
app.signature.required=${SIGNATURE_REQUIRED:false}

# Disputes: evidence uploads (stored on local filesystem)
app.disputes.upload-dir=${DISPUTES_UPLOAD_DIR:./uploads/disputes}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

# Mail (optional; set MAIL_ENABLED=true to actually send emails)
app.mail.enabled=${MAIL_ENABLED:true}
spring.mail.from=${MAIL_FROM:shiliamine117@gmail.com}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:shiliamine117@gmail.com}
spring.mail.password=${MAIL_PASSWORD:jvbd dfil reaq clsp}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ─── AI / Google Gemini ──────────────────────────────────────────────────────
# Clé API Google AI Studio — https://aistudio.google.com/apikey
gemini.api.key=AIzaSyCcPY_h6XgktloF-u6sVF3seGUvVi7lYJE
groq.api.key=${GROQ_API_KEY:}
groq.model=llama-3.3-70b-versatile
# Model name can be changed if your quota/plan only allows specific models.
gemini.model=gemini-2.0-flash

# Gemini: robustness (avoid HTTP 429 spikes)
# Limit in-flight Gemini calls per app instance.
gemini.max.concurrent=2
# Retry on 429/5xx with exponential backoff (+ jitter). Keep small to avoid blocking request threads.
gemini.retry.max-attempts=3
gemini.retry.initial-backoff-ms=750
gemini.retry.max-backoff-ms=8000

ml.service.url=http://localhost:8001
ml.service.timeout=30000

# ============================================
# CORS Configuration
# ============================================
cors.allowed.origins=http://localhost:4200
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
cors.allow.credentials=true
