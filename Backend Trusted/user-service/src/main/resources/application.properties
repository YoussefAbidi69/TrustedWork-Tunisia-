# ============================================
# SERVER CONFIGURATION
# ============================================
spring.application.name=user-service

server.port=8081
server.servlet.context-path=/api

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# ============================================
# DATABASE (MySQL)
# ============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trustedwork_user_db?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ============================================
# JPA / HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# JWT CONFIGURATION
# ============================================
jwt.secret=${JWT_SECRET:CHANGE_ME_LOCAL_ONLY}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ============================================
# 2FA CONFIGURATION
# ============================================
app.2fa.issuer=${TWO_FA_ISSUER:PICloud-TrustedWork}

# ============================================
# MAIL (Gmail SMTP)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ============================================
# SPRINGDOC / SWAGGER
# ============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ============================================
# LOGGING
# ============================================
logging.level.tn.esprit.picloud=DEBUG
logging.level.org.springframework.security=DEBUG

# ============================================
# GOOGLE OAUTH2
# ============================================
google.oauth2.client-id=${GOOGLE_CLIENT_ID:}
google.oauth2.client-secret=${GOOGLE_CLIENT_SECRET:}

# ============================================
# CLOUDINARY
# ============================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ============================================
# LOCAL PROFILE
# ============================================
spring.profiles.active=local