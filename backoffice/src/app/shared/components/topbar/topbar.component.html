<header class="topbar">
  <div class="topbar-left">
    <button class="topbar-menu-btn" (click)="onToggle()">
      <i class="fas fa-bars"></i>
    </button>
    <div class="topbar-search">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Search users, reviews, contracts...">
    </div>
  </div>

  <div class="topbar-right">
    <div class="topbar-date">
      <i class="fas fa-calendar"></i>
      <span>{{ currentDate | date:'MMM d, yyyy' }}</span>
    </div>

    <!-- ── Cloche notifications ── -->
    <div class="notif-wrapper">
      <button class="topbar-icon-btn" (click)="toggleDropdown()">
        <i class="fas fa-bell"></i>
        <!-- Badge rouge avec compteur -->
        <span class="notif-badge" *ngIf="unreadCount > 0">
          {{ unreadCount > 9 ? '9+' : unreadCount }}
        </span>
        <!-- Point rouge simple si aucune non-lue mais dropdown fermé -->
        <span class="notif-dot" *ngIf="unreadCount === 0 && notifications.length === 0"></span>
      </button>

      <!-- Dropdown notifications -->
      <div class="notif-dropdown" *ngIf="showDropdown">

        <!-- En-tête -->
        <div class="notif-header">
          <span class="notif-title">Notifications</span>
          <div class="notif-header-actions">
            <button class="notif-action-btn" (click)="markAllRead()" *ngIf="unreadCount > 0" title="Tout marquer comme lu">
              <i class="fas fa-check-double"></i>
            </button>
            <button class="notif-action-btn notif-action-btn--danger" (click)="clearAll()" *ngIf="notifications.length > 0" title="Tout effacer">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>

        <!-- Liste -->
        <div class="notif-list">

          <!-- État vide -->
          <div class="notif-empty" *ngIf="notifications.length === 0">
            <i class="fas fa-bell-slash"></i>
            <span>Aucune notification</span>
          </div>

          <!-- Items -->
          <div
            class="notif-item"
            [class.notif-item--unread]="!notif.read"
            *ngFor="let notif of notifications">

            <div class="notif-item-icon" [ngClass]="'notif-icon--' + notif.type.toLowerCase()">
              <i [class]="getNotifIcon(notif.type)"></i>
            </div>

            <div class="notif-item-body">
              <span class="notif-item-msg">{{ notif.message }}</span>
              <span class="notif-item-time">{{ notif.time | date:'HH:mm' }}</span>
            </div>

            <span class="notif-item-dot" *ngIf="!notif.read"></span>
          </div>
        </div>

        <!-- Footer -->
        <div class="notif-footer" *ngIf="notifications.length > 0">
          <span class="notif-count-label">{{ notifications.length }} notification{{ notifications.length > 1 ? 's' : '' }}</span>
        </div>

      </div>
    </div>
    <!-- ── Fin cloche ── -->

    <div class="topbar-admin">
      <div class="avatar avatar-sm avatar-accent">AD</div>
      <div class="admin-info">
        <strong>Admin</strong>
        <span>Super Admin</span>
      </div>
    </div>

    <button class="topbar-icon-btn logout-btn" (click)="onLogout()" title="Logout">
      <i class="fas fa-right-from-bracket"></i>
    </button>
  </div>
</header>
