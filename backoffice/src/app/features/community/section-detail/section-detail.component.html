<div class="community-page">
  <div class="page-header">
    <div class="header-left">
      <button class="btn btn-ghost btn-sm" (click)="goBack()">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div>
        <h1 class="page-title">Section Details</h1>
        <p class="page-subtitle">ID: #{{ item?.id }}</p>
      </div>
    </div>
    <div class="page-actions">
      <button class="btn btn-danger" (click)="deleteItem()">
        <i class="fas fa-trash"></i> Delete Section
      </button>
    </div>
  </div>

  <div class="empty-state" *ngIf="loading">
    <i class="fas fa-spinner fa-spin"></i>
    <p>Loading section details...</p>
  </div>

  <div class="detail-grid" *ngIf="!loading && item">
    <div class="detail-main">
      <div class="card">
        <div class="card-header">
          <h3><i class="fas fa-puzzle-piece"></i> Section Info</h3>
        </div>
        <div class="card-body">
          <div class="info-group">
            <label>Title</label>
            <div class="info-value title-value">{{ item.title }}</div>
          </div>
          <div class="info-group">
            <label>Order Index</label>
            <div class="info-value">{{ item.orderIndex }}</div>
          </div>
          <div class="info-group">
            <label>Belongs to Course</label>
            <div class="info-value">
              <a [routerLink]="['/admin/community/courses', item.courseId, 'detail']">Course #{{ item.courseId }}</a>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top: 20px;">
        <div class="card-header">
          <h3><i class="fas fa-cubes"></i> Blocks in this Section</h3>
        </div>
        <div class="card-body">
          <div class="blocks-mini-list">
            <div class="block-mini-item" *ngFor="let block of item.blocks">
              <div class="block-info">
                <span class="badge badge-sm badge-info">{{ block.type }}</span>
                <strong>{{ block.title }}</strong>
              </div>
              <a class="btn btn-ghost btn-sm" [routerLink]="['/admin/community/blocks', block.id, 'detail']">
                <i class="fas fa-eye"></i>
              </a>
            </div>
            <div class="empty-state" *ngIf="!item.blocks?.length">
              <p>No blocks in this section</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
