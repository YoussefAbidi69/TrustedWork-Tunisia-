<div class="community-page">
  <div class="page-header">
    <div class="header-left">
      <button class="btn btn-ghost btn-sm" (click)="goBack()">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div>
        <h1 class="page-title">Block Details</h1>
        <p class="page-subtitle">ID: #{{ item?.id }}</p>
      </div>
    </div>
    <div class="page-actions">
      <button class="btn btn-danger" (click)="deleteItem()">
        <i class="fas fa-trash"></i> Delete Block
      </button>
    </div>
  </div>

  <div class="empty-state" *ngIf="loading">
    <i class="fas fa-spinner fa-spin"></i>
    <p>Loading block details...</p>
  </div>

  <div class="detail-grid" *ngIf="!loading && item">
    <!-- Main Content -->
    <div class="detail-main">
      <div class="card info-card">
        <div class="card-header">
          <h3><i class="fas fa-file-lines"></i> Content</h3>
        </div>
        <div class="card-body">
          <div class="info-group">
            <label>Title</label>
            <div class="info-value title-value">{{ item.title || 'No Title' }}</div>
          </div>
          <div class="info-group">
            <label>Content</label>
            <div class="info-value content-box">
              {{ item.content || 'No text content' }}
            </div>
          </div>
          <div class="info-group" *ngIf="item.fileUrl">
            <label>Attached File / URL</label>
            <div class="info-value file-box">
              <i class="fas fa-paperclip"></i>
              <a [href]="item.fileUrl" target="_blank">{{ item.fileUrl }}</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Sidebar Info -->
    <div class="detail-sidebar">
      <div class="card metadata-card">
        <div class="card-header">
          <h3><i class="fas fa-info-circle"></i> Metadata</h3>
        </div>
        <div class="card-body">
          <div class="meta-item">
            <span class="label">Type</span>
            <span class="value badge badge-info">{{ item.type }}</span>
          </div>
          <div class="meta-item">
            <span class="label">Section ID</span>
            <span class="value">#{{ item.sectionId }}</span>
          </div>
          <div class="meta-item">
            <span class="label">Order Index</span>
            <span class="value">{{ item.orderIndex }}</span>
          </div>
        </div>
      </div>

      <div class="card preview-card" *ngIf="item.type === 'IMAGE' && item.fileUrl">
        <div class="card-header">
          <h3><i class="fas fa-image"></i> Preview</h3>
        </div>
        <div class="card-body">
          <img [src]="item.fileUrl" class="block-preview-img" alt="Block Preview">
        </div>
      </div>
    </div>
  </div>
</div>
