<div class="community-page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Course Sections</h1>
      <p class="page-subtitle">{{ filteredItems.length }} sections found</p>
    </div>
    <div class="page-actions">
      <button class="btn btn-ghost btn-sm" (click)="loadData()">
        <i class="fas fa-rotate-right"></i> Refresh
      </button>
    </div>
  </div>

  <div class="filters-bar" style="margin-bottom: 20px; display: flex; gap: 10px;">
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" class="form-control" placeholder="Search by title or Course ID..." [(ngModel)]="searchQuery" (input)="onSearch()">
    </div>
  </div>

  <div class="empty-state" *ngIf="loading">
    <i class="fas fa-spinner fa-spin"></i>
    <p>Loading...</p>
  </div>

  <div class="card" *ngIf="!loading">
    <div class="table-wrap">
      <table class="tw-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Course ID</th>
            <th>Order Index</th>
            <th>Created At</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of filteredItems">
            <td>{{ item.id }}</td>
            <td><strong>{{ item.title }}</strong></td>
            <td>#{{ item.courseId }}</td>
            <td>{{ item.orderIndex }}</td>
            <td>{{ item.createdAt | date:'MMM d, yyyy' }}</td>
            <td>
              <div class="action-btns">
                <a class="btn btn-sm btn-ghost" [routerLink]="['/admin/community/sections', item.id, 'detail']">
                  <i class="fas fa-eye"></i> Details
                </a>
                <button class="btn btn-sm btn-danger" (click)="deleteItem(item)" [disabled]="actionLoading === item.id">
                  <i class="fas fa-trash"></i> Delete
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="empty-state" *ngIf="filteredItems.length === 0">
        <i class="fas fa-folder-open"></i>
        <p>No items found</p>
      </div>
    </div>
  </div>
</div>
